<!DOCTYPE html>
<html lang="fr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="theme-color" content="#0f172a">
    <title>💎 Gestion - Modern Edition</title>
    <link rel="stylesheet" href="style.css">
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;700;900&display=swap" rel="stylesheet">
    <script src="https://cdn.jsdelivr.net/npm/chart.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/chartjs-plugin-datalabels@2"></script>
</head>
<body>

    <header class="header">
        <div class="container">
            <h1>Gestion</h1>
            <nav class="nav-tabs">
                <button class="nav-btn active" data-tab="expenses">DÉPENSES</button>
                <button class="nav-btn" data-tab="stats">STATS</button>
                <button class="nav-btn" data-tab="yearly">ANNÉE</button>
            </nav>
        </div>
        <div id="month-selector" class="card" style="display: flex; justify-content: space-between; align-items: center; padding: 0.8rem 1.2rem;">
            <button id="prev-month" class="nav-btn" style="padding: 0.4rem 0.8rem;">&lt;</button>
            <div style="display: flex; flex-direction: column; align-items: center; gap: 2px;">
                <span id="current-month-display" style="font-weight: 800; font-size: 0.9rem; text-transform: uppercase; letter-spacing: 1px;"></span>
                <span id="today-date-display" style="font-size: 0.6rem; color: var(--text-mid); font-weight: 600; opacity: 0.8;"></span>
            </div>
            <button id="next-month" class="nav-btn" style="padding: 0.4rem 0.8rem;">&gt;</button>
        </div>
    </header>

    <main class="container">
        
        <section id="expenses-tab" class="tab-content active">
            <div class="card">
                <div class="budget-widget">
                    <div class="stat-box">
                        <span class="stat-label">Budget</span>
                        <span id="stat-budget" class="stat-value">0 €</span>
                    </div>
                    <div class="stat-box">
                        <span class="stat-label">Dépensé</span>
                        <span id="stat-spent" class="stat-value">0 €</span>
                    </div>
                    <div class="stat-box">
                        <span class="stat-label">Restant</span>
                        <span id="stat-remaining" class="stat-value remaining">0 €</span>
                    </div>
                </div>
                <div class="budget-bar">
                    <div id="budget-progress" class="budget-progress"></div>
                </div>
            </div>

            <div class="card">
                <input type="text" id="desc" placeholder="Désignation (ex: Netflix)" list="common-desc">
                <datalist id="common-desc">
                    <option value="Netflix">
                    <option value="Spotify">
                    <option value="Loyer">
                    <option value="Courses Alimentaires">
                    <option value="Carburant">
                    <option value="Internet (Box)">
                    <option value="Électricité / Gaz">
                    <option value="Assurance">
                    <option value="Restaurant">
                    <option value="Boulangerie">
                    <option value="Pharmacie">
                    <option value="Abonnement Mobile">
                </datalist>
                <input type="number" id="amount" placeholder="Montant (€)">
                <select id="category">
                    <option value="🏠 LOGEMENT">🏠 LOGEMENT</option>
                    <option value="🍽️ ALIMENTATION">🍽️ ALIMENTATION</option>
                    <option value="🚗 TRANSPORT">🚗 TRANSPORT</option>
                    <option value="🎮 LOISIRS">🎮 LOISIRS</option>
                    <option value="🏥 SANTÉ">🏥 SANTÉ</option>
                    <option value="AUTRE">✨ AUTRE</option>
                </select>
                <button id="add-btn" class="btn-primary">Ajouter la dépense</button>
            </div>

            <div id="expense-list"></div>
        </section>

        <section id="stats-tab" class="tab-content">
            <div class="card">
                <h3 style="text-align: center; margin-bottom: 1.5rem; font-size: 0.8rem; color: var(--text-mid); letter-spacing: 1px; text-transform: uppercase;">Répartition par catégorie</h3>
                <div style="height: 250px; position: relative;">
                    <canvas id="categoryChart"></canvas>
                </div>
            </div>
            
            <div class="card">
                <label for="budget-input" style="display: block; margin-bottom: 10px; font-size: 0.7rem; color: var(--text-mid); font-weight: 700; text-transform: uppercase;">Modifier mon budget mensuel (€)</label>
                <input type="number" id="budget-input" placeholder="Ex: 3000">
            </div>

            <div class="card">
                <h3 style="text-align: center; margin-bottom: 1.5rem; font-size: 0.8rem; color: var(--text-mid); letter-spacing: 1px; text-transform: uppercase;">Évolution quotidienne (€)</h3>
                <div style="height: 220px; position: relative;">
                    <canvas id="dailyChart"></canvas>
                </div>
            </div>

            <div class="card" style="border-color: var(--danger); border-style: dashed;">
                <h3 style="font-size: 0.7rem; color: var(--danger); letter-spacing: 1px; text-transform: uppercase; margin-bottom: 1rem;">Zone de danger</h3>
                <button onclick="resetExpenses()" class="btn-primary" style="background: var(--danger); font-size: 0.7rem; padding: 0.6rem;">Réinitialiser toutes les données</button>
            </div>
        </section>

        <section id="yearly-tab" class="tab-content">
            <div class="card">
                <h3 style="text-align: center; margin-bottom: 1.5rem; font-size: 0.8rem; color: var(--text-mid); letter-spacing: 1px; text-transform: uppercase;">Vue d'ensemble de l'année <span id="yearly-display-year"></span></h3>
                <div style="height: 350px; position: relative;">
                    <canvas id="yearlyChart"></canvas>
                </div>
            </div>

            <div class="card">
                <p style="font-size: 0.7rem; color: var(--text-mid); margin-bottom: 1rem; text-align: center;">Générez des exemples pour tester le graphique annuel sur l'année en cours.</p>
                <button onclick="injectSampleData()" class="btn-primary" style="background: var(--secondary-accent); font-size: 0.7rem; padding: 0.5rem;">Simuler dépenses Janvier à Mai 2026</button>
            </div>
        </section>
    </main>

    <button id="today-btn">Aujourd'hui</button>

    <div id="toast" class="toast"></div>

    <footer style="text-align: center; padding: 2rem; color: var(--text-low); font-size: 0.7rem; letter-spacing: 1px;">
        <div id="app-version">MODERN EDITION v5.3.1</div>
    </footer>

    <script src="app.js"></script>
</body>
</html>
