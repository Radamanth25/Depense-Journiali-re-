<!DOCTYPE html>
<html lang="fr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Mon Budget Pixel</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>

    <div class="container">
        <div class="card">
            <h2>Nouvelle dépense</h2>
            <input type="text" id="desc" placeholder="Objet (ex: Cinéma)" autocomplete="off">
            <input type="number" id="amount" placeholder="Montant en €" step="0.01">
            <button id="add-btn">Ajouter</button>
        </div>

        <div class="card total-card">
            <div class="total-label">Total dépensé</div>
            <div id="total-amount">0.00 €</div>
        </div>

        <div class="card">
            <h2>Historique</h2>
            <div id="expense-list">
                <!-- Les dépenses s'afficheront ici -->
            </div>
        </div>
    </div>

    <script src="script.js"></script>
</body>
</html>
